<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27348b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AarohCare">
<title>AarohCare Tracker</title>
<script>try{var t=JSON.parse(localStorage.getItem("ac_theme")||"null")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo.png">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#101828; --mute:#667085; --line:#eaecf0; --soft:#f9fafb;
  --brand:#27348b; --brand2:#3a7bbd; --brand-soft:#eef2ff;
  --red:#d92d20; --red-bg:#fef3f2; --amber:#b54708; --amber-bg:#fffaeb; --amber-line:#f79009;
  --blue:#175cd3; --blue-bg:#eff8ff; --violet:#6941c6; --violet-bg:#f4f3ff;
  --green:#067647; --green-bg:#ecfdf3; --slate:#475467; --slate-bg:#f2f4f7;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:10px;flex:none}
.brand h1{font-size:16.5px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.brand small{display:block;color:var(--mute);font-size:12px;margin-top:-2px}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--slate);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#98a2b3;display:inline-block}
.sync.ok i{background:#12b76a}.sync.busy i{background:var(--amber-line);animation:pulse 1s infinite}.sync.err{border-color:#fda29b;background:var(--red-bg);color:var(--red)}.sync.err i{background:var(--red)}
.sync.warn{border-color:#fedf89;background:var(--amber-bg);color:var(--amber)}.sync.warn i{background:var(--amber-line)}
@keyframes pulse{50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #e0e3ea;background:#fff;border-radius:12px;padding:9px 15px;font-weight:600;min-height:40px;transition:.12s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1f2a75}
.btn.danger{color:var(--red);border-color:#fda29b}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.icon{padding:0;width:40px}
.btn:disabled{opacity:.55;cursor:default}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:18px 0 8px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;background:#fff;color:var(--ink);position:relative;transition:.12s}
.kpi b{display:block;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.03em;color:var(--c)}
.kpi span{display:block;font-size:13px;margin-top:4px;font-weight:600;color:var(--ink)}
.kpi em{display:block;font-size:12px;font-style:normal;color:var(--mute)}
.kpi:hover{border-color:#d0d5dd}
.kpi.on{border-color:var(--c);background:var(--c-bg)}
.kpi.zero b{color:#c0c5d0}
.k-overdue{--c:var(--red);--c-bg:var(--red-bg)}.k-today{--c:#dc6803;--c-bg:var(--amber-bg)}
.k-week{--c:var(--blue);--c-bg:var(--blue-bg)}.k-nodate{--c:var(--violet);--c-bg:var(--violet-bg)}
.k-all{--c:#344054;--c-bg:var(--slate-bg)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 4px}
.search{flex:1 1 220px;position:relative;min-width:180px}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:42px}
.search svg{position:absolute;left:11px;top:11px;color:var(--mute)}
.fl{display:none;gap:8px;flex-wrap:wrap;width:100%}.fl.on{display:flex}
#fcount{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;line-height:18px;text-align:center}
.bar select{width:auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;min-height:40px;max-width:100%;color:var(--slate);font-weight:500}
.tabs{display:inline-flex;background:#eceef5;border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--slate);min-height:36px}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--mute);font-size:12.5px;padding:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* groups */
.group{margin:22px 0 26px}
.g-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.g-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.g-head small{color:var(--mute);font-size:13px}
.g-head .n{background:var(--c-bg);color:var(--c);font-weight:700;border-radius:999px;padding:1px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
details.group>summary{list-style:none;cursor:pointer}
details.group>summary::-webkit-details-marker{display:none}

/* urgency colour system (used by stripe, badge, headings) */
.u-overdue{--u:var(--red);--u-bg:var(--red-bg);--c:var(--red);--c-bg:var(--red-bg)}
.u-today{--u:var(--amber-line);--u-bg:var(--amber-bg);--c:var(--amber);--c-bg:var(--amber-bg)}
.u-week{--u:var(--blue);--u-bg:var(--blue-bg);--c:var(--blue);--c-bg:var(--blue-bg)}
.u-later{--u:#98a2b3;--u-bg:var(--slate-bg);--c:var(--slate);--c-bg:var(--slate-bg)}
.u-nodate{--u:var(--violet);--u-bg:var(--violet-bg);--c:var(--violet);--c-bg:var(--violet-bg)}
.u-won{--u:#12b76a;--u-bg:var(--green-bg);--c:var(--green);--c-bg:var(--green-bg)}
.u-lost,.u-closed{--u:#d0d5dd;--u-bg:var(--slate-bg);--c:var(--slate);--c-bg:var(--slate-bg)}

/* card */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:4px solid var(--u);padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:.15s}
.card:hover{box-shadow:0 6px 18px rgba(16,24,40,.08);border-color:#dfe3ea;border-left-color:var(--u)}
.c-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.c-title{min-width:0}
.c-title h3{font-size:15.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.c-title p{font-size:12.5px;color:var(--mute);margin-top:3px}
.badge{flex:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--u-bg);color:var(--c);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0;font-size:12.5px;font-weight:600;background:none;color:var(--slate)}
.pri-high{color:var(--ink);font-weight:700}.pri-medium{color:var(--slate)}.pri-low{color:var(--mute);font-weight:500}
.act-call,.act-meeting{color:var(--slate)}
.st-demo,.st-meeting,.st-nego{background:#ccfbf1;color:#0f766e;padding:2px 9px}.st-won{background:var(--green-bg);color:var(--green);padding:2px 9px}.st-lost{background:var(--slate-bg);color:var(--mute);padding:2px 9px}.st-new{display:none}
.meter{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--slate)}
.meter s{display:inline-flex;gap:2px;align-items:flex-end;text-decoration:none}
.meter s i{width:5px;border-radius:2px;background:#d0d5dd;display:block}
.meter s i:nth-child(1){height:6px}.meter s i:nth-child(2){height:9px}.meter s i:nth-child(3){height:12px}.meter s i:nth-child(4){height:15px}
.meter.m4 s i,.meter.m3 s i,.meter.m2 s i,.meter.m1 s i{}
.meter.m4 s i:nth-child(-n+4){background:#0e9384}.meter.m3 s i:nth-child(-n+3){background:#2e90fa}.meter.m2 s i:nth-child(-n+2){background:#f79009}.meter.m1 s i:nth-child(-n+1){background:#98a2b3}
.next{font-size:13.5px;color:#344054;overflow-wrap:anywhere;line-height:1.45}
.next b{font-weight:700;color:var(--mute);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;margin-right:8px}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap;border-top:1px solid #f0f2f5;padding-top:11px}
.who{font-size:13px;color:#344054;min-width:0}
.who small{color:var(--mute)}
.nophone{color:var(--violet);background:var(--violet-bg);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.quick{display:flex;gap:6px;align-items:center}
.qb{display:inline-flex;align-items:center;gap:6px;border-radius:11px;padding:7px 12px;font-weight:650;font-size:13px;text-decoration:none;min-height:36px}
.qb.call{background:var(--brand);color:#fff}.qb.wa{background:#e7f8ee;color:#067647}
.qb.sm{padding:5px 9px;min-height:30px;font-size:12.5px}
.photos{display:flex;gap:5px;align-items:center}
.photos img,.ph-thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;background:#e4e7ec;border:1px solid var(--line)}
.photos span{font-size:12px;color:var(--mute)}

/* pipeline */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding:14px 0 24px;align-items:start}
.col{background:#e9ecf5;border-radius:var(--r);padding:10px;min-height:120px}
.col h2{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;padding:4px 4px 10px}
.col .stack{display:flex;flex-direction:column;gap:9px}
.card.mini{padding:10px 11px;gap:7px}.card.mini h3{font-size:14.5px}

.empty{text-align:center;color:var(--mute);padding:50px 10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.banner{background:var(--amber-bg);border:1px solid #fedf89;color:var(--amber);border-radius:11px;padding:10px 14px;margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{scroll-padding:72px 0;background:#fff;width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom));position:relative}
@media(min-width:760px){.veil{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
.sh-head{position:sticky;top:0;background:#fff;z-index:2;padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.sh-head h2{font-size:19px;font-weight:700;flex:1;line-height:1.25}
.sh-body{padding:14px 18px;display:flex;flex-direction:column;gap:16px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
.sec p.t{white-space:pre-wrap;overflow-wrap:anywhere}
.nextbox{border:1px solid color-mix(in srgb,var(--u) 35%,#fff);background:var(--u-bg);border-radius:14px;padding:14px}
.nextbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.contact{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.contact .nm{font-weight:650}.contact .nm small{font-weight:500;color:var(--mute);margin-left:6px}
.phrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.phrow span{font-variant-numeric:tabular-nums;font-size:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#e4e7ec}
.log{display:flex;flex-direction:column;gap:8px}
.log div{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:14px}
.log small{color:var(--mute);display:block;font-size:12px}
.row-in{display:flex;gap:8px}
.row-in input{flex:1}

/* form */
form .fld{display:flex;flex-direction:column;gap:5px}
form label.l{font-size:12.5px;font-weight:650;color:#344054}
input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #b2ccff;border-color:var(--brand2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;border:1px solid #d0d5dd;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;background:#fff;min-height:40px;display:flex;align-items:center}
.seg input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg input:focus-visible+span{outline:2px solid #b2ccff}
.ct{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ct .phs{display:flex;flex-direction:column;gap:6px}
.ct .ph-row{display:flex;gap:6px}
.ct .ct-actions{display:flex;justify-content:space-between;gap:8px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:650;padding:4px 2px;min-height:32px}
.linkbtn.red{color:var(--red)}
.imgs{display:flex;flex-wrap:wrap;gap:8px}
.imgs .im{position:relative;width:84px;height:84px}
.imgs .im img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#e4e7ec}
.imgs .im button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:#101828;color:#fff;font-size:15px;line-height:1;padding:0}
.addimg{width:84px;height:84px;border:1.5px dashed #98a2b3;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--slate);font-size:12px;font-weight:600;background:#fff}
.sh-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;justify-content:space-between}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.on{display:flex}.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:14px;right:14px;background:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#101828;color:#fff;border-radius:11px;padding:10px 16px;z-index:70;font-size:14px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(39,52,139,.4);display:none;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}
.help{font-size:13px;color:var(--mute)}
.help ol{padding-left:18px;margin:6px 0}
.broken{opacity:.35}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.meta span{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:4px 9px;font-size:12.5px;font-weight:700;max-width:100%;min-width:0}
.meta svg.i{width:14px;height:14px}
.meta .pin{background:var(--brand-soft);color:var(--brand)}.meta .pin.none{background:var(--violet-bg);color:var(--violet);font-weight:600}
.meta .vd{background:var(--slate-bg);color:var(--slate)}
/* dark mode + menu + analytics */
html[data-theme=dark]{color-scheme:dark;--bg:#0c111d;--card:#161b26;--ink:#f2f4f7;--mute:#98a2b3;--line:#262d3b;--soft:#1d2433;--brand:#5b6ff0;--brand2:#5b9be0;--brand-soft:#1c2347;--red:#f97066;--red-bg:#3a1a1a;--amber:#fdb022;--amber-bg:#35270f;--blue:#84caff;--blue-bg:#14263d;--violet:#b3a5f7;--violet-bg:#261f45;--green:#47cd89;--green-bg:#0f2d20;--slate:#cfd4dc;--slate-bg:#1d2433}
html[data-theme=dark] :is(.btn,.sync,.kpi,.search input,.chip,.sheet,.sh-foot,.seg span,select,input,textarea,.tabs button.on){background:var(--card);color:var(--ink);border-color:var(--line)}
html[data-theme=dark] :is(.btn.primary,.chip.on,.seg input:checked+span){background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme=dark] .kpi.on{background:var(--c-bg);border-color:var(--c)}
html[data-theme=dark] .tabs{background:var(--soft)}
html[data-theme=dark] .tabs button{color:var(--mute)}html[data-theme=dark] .tabs button.on{color:#fff;background:var(--brand)}
html[data-theme=dark] .sync.err{background:var(--red-bg)}html[data-theme=dark] .sync.warn{background:var(--amber-bg)}
html[data-theme=dark] header.top{background:rgba(12,17,29,.9)}
html[data-theme=dark] .btn:hover{background:var(--soft)}
html[data-theme=dark] :is(.next,.who,form label.l){color:var(--slate)}
html[data-theme=dark] .c-foot{border-top-color:var(--line)}
html[data-theme=dark] :is(.st-demo,.st-meeting,.st-nego){background:#0f3d3a;color:#5eead4}
html[data-theme=dark] :is(.col,.addimg,.gal img,.photos img,.ph-thumb,.imgs .im img){background:var(--soft)}
html[data-theme=dark] .qb.wa{background:#0f2d20;color:#47cd89}
html[data-theme=dark] .sh-head{background:var(--card)}
html[data-theme=dark] .meter s i{background:#3a4254}
html[data-theme=dark] .banner{border-color:#5a4410}
html[data-theme=dark] .btn.danger{color:var(--red)}
html[data-theme=dark] .k-all{--c:#cfd4dc}html[data-theme=dark] .kpi.zero b{color:#4a5366}
.moon{display:block}.sun{display:none}html[data-theme=dark] .moon{display:none}html[data-theme=dark] .sun{display:block}
.menu{position:absolute;right:max(16px,calc((100vw - 1240px)/2 + 16px));top:calc(100% + 6px);width:248px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(16,24,40,.2);padding:6px;z-index:50}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;text-align:left;color:var(--ink)}

<script>
/* ============ helpers ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const parse=s=>new Date(s+'T12:00:00');
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const addDays=(s,n)=>{const d=s?parse(s):new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmtD=(s,o)=>s?parse(s).toLocaleDateString('en-IN',o||{weekday:'short',day:'numeric',month:'short'}):'';
const fmtPh=p=>{const d=String(p).replace(/\D/g,'');return (!String(p).startsWith('+')&&d.length===10)?d.slice(0,5)+' '+d.slice(5):p};
const telHref=p=>{const d=String(p).replace(/[^\d+]/g,'');return 'tel:'+(d.startsWith('+')?d:(d.length===10?'+91'+d:d))};
const waHref=p=>{let d=String(p).replace(/\D/g,'');if(d.length===10)d='91'+d;return 'https://wa.me/'+d};
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ constants ============ */
const TYPES=['Clinic','Polyclinic','Diagnostic Lab','Multi-Specialty Hospital','Hospital','Pharmacy','Other'];
const DEPTS=['Dental','General Medicine','Lab','Clinic','Ophthalmology / Eye','Pediatrics','Orthopedics','Gynecology','Dermatology','Other'];
const ROLES=['General Physician / Owner','Owner','Doctor','Manager','Lab Admin Manager','Receptionist','Director','Medical Director'];
const INTEREST={highly:{l:'Highly interested',n:4},interested:{l:'Interested',n:3},evaluating:{l:'Evaluating',n:2},not:{l:'Not interested',n:1}};
const PRI={high:'High',medium:'Medium',low:'Low'};
const ACT={call:'Call needed',meeting:'Meeting / demo',none:'No action'};
const STAGES=[['new','New visit'],['demo','Demo sent'],['meeting','Meeting set'],['nego','Negotiating'],['won','Onboarded'],['lost','Not now / lost']];
const STAGE=Object.fromEntries(STAGES);
const URG={
  overdue:{h:'Overdue',sub:'Follow-up date has passed — do these first',k:'Overdue'},
  today:{h:'Due today',sub:'',k:'Due today'},
  week:{h:'Next 7 days',sub:'',k:'Next 7 days'},
  later:{h:'Later',sub:'',k:'Later'},
  nodate:{h:'Needs a follow-up date',sub:'Open leads with no date — pick one',k:'No date set'},
  closed:{h:'Closed',sub:'Onboarded or not now',k:'Closed'}
};
const GH='https://api.github.com';
const DATA_PATH='data/leads.json';

/* ============ state ============ */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S={
  cfg:store.get('ac_cfg',null),
  remote:store.get('ac_cache',{leads:[]}).leads||[],
  pending:store.get('ac_pending',[]),
  leads:[],view:'action',q:'',fType:'',fInterest:'',fPriority:'',fAction:'',urg:'',showF:false,
  status:'idle',statusMsg:'',readonly:false,openId:null,lastSync:null
};

/* ============ data ops ============ */
function applyOps(base,ops){
  let a=base.slice();
  for(const op of ops){
    if(op.type==='upsert'){const i=a.findIndex(x=>x.id===op.lead.id);if(i>=0)a[i]=op.lead;else a.push(op.lead)}
    else if(op.type==='delete')a=a.filter(x=>x.id!==op.id);
  }
  return a;
}
function recompute(){S.leads=applyOps(S.remote,S.pending)}
function persistPending(){store.set('ac_pending',S.pending)}
function commit(op){
  if(!S.cfg){openSettings('Connect GitHub first so changes can be saved.');return false}
  S.pending.push(op);persistPending();recompute();render();
  if(S.openId)renderDetail();
  schedulePush();return true;
}

/* ============ GitHub ============ */
const repoUrl=p=>`${GH}/repos/${S.cfg.owner}/${S.cfg.repo}${p?'/'+p:''}`;
const refQ=()=>S.cfg.branch?`?ref=${encodeURIComponent(S.cfg.branch)}`:'';
function gh(p,opts={}){
  return fetch(repoUrl(p),{cache:'no-store',...opts,headers:{
    'Authorization':'Bearer '+S.cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
}
async function errMsg(r){
  let m='';try{m=(await r.json()).message||''}catch{}
  if(r.status===401)return 'Token is wrong or expired';
  if(r.status===403)return m.includes('rate')?'GitHub rate limit, try in a minute':'Token has no write access to this repo';
  if(r.status===404)return 'Repo not found, or token cannot see it';
  return m||('GitHub error '+r.status);
}
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64enc=str=>{const u=new TextEncoder().encode(str);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function fetchData(){
  const r=await gh(`contents/${DATA_PATH}${refQ()}`);
  if(r.status===404){
    const rr=await gh('');if(!rr.ok)throw new Error(await errMsg(rr));
    return {data:{version:1,leads:[]},sha:null};
  }
  if(!r.ok)throw new Error(await errMsg(r));
  const j=await r.json();let text;
  if(j.content)text=b64dec(j.content);
  else{const r2=await gh(`contents/${DATA_PATH}${refQ()}`,{headers:{'Accept':'application/vnd.github.raw+json'}});text=await r2.text()}
  const data=JSON.parse(text);data.leads=data.leads||[];
  return {data,sha:j.sha};
}
async function applyRemote(op){
  for(let i=0;i<4;i++){
    const {data,sha}=await fetchData();
    data.leads=applyOps(data.leads,[op]);
    data.updatedAt=new Date().toISOString();
    const body={message:op.type==='delete'?'Delete lead':`Update: ${op.lead.name||'lead'}`,content:b64enc(JSON.stringify(data,null,1))};
    if(sha)body.sha=sha;if(S.cfg.branch)body.branch=S.cfg.branch;
    const r=await gh('contents/'+DATA_PATH,{method:'PUT',body:JSON.stringify(body)});
    if(r.ok)return data.leads;
    if(r.status===409||r.status===422){await sleep(400);continue}
    throw new Error(await errMsg(r));
  }
  throw new Error('Someone else edited at the same time — tap to retry');
}
let pushTimer=null,pushing=false;
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(pushAll,250);setStatus('busy','Saving…')}
async function pushAll(){
  if(pushing||!S.cfg)return;pushing=true;
  try{
    while(S.pending.length){
      setStatus('busy',`Saving… (${S.pending.length})`);
      S.remote=await applyRemote(S.pending[0]);
      S.pending.shift();persistPending();
      store.set('ac_cache',{leads:S.remote});
    }
    recompute();S.lastSync=new Date();setStatus('ok');render();if(S.openId)renderDetail();
  }catch(e){
    setStatus('err',e.message||'Sync failed');
  }finally{pushing=false}
}
async function load(silent){
  if(!S.cfg){
    try{const r=await fetch('data/leads.json',{cache:'no-store'});if(r.ok){const d=await r.json();S.remote=d.leads||[];S.readonly=true}}catch{}
    recompute();setStatus('none');render();return;
  }
  if(S.pending.length){pushAll();return}
  if(!silent)setStatus('busy','Syncing…');
  try{
    const {data}=await fetchData();
    S.remote=data.leads;store.set('ac_cache',{leads:S.remote});
    recompute();S.lastSync=new Date();setStatus('ok');render();
    if(S.openId&&!$('#veilForm').classList.contains('on'))renderDetail();
  }catch(e){setStatus('err',e.message)}
}
function setStatus(k,msg){
  S.status=k;S.statusMsg=msg||'';
  const el=$('#sync'),lbl=$('#syncLbl');
  el.className='sync '+({ok:'ok',busy:'busy',err:'err',pend:'warn',none:'warn'}[k]||'');
  const t=S.lastSync?S.lastSync.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
  lbl.textContent=({ok:'Synced '+t,busy:msg||'Syncing…',err:(msg||'Sync failed')+' · retry',none:S.readonly?'Preview only · connect':'Not connected',idle:'…',pend:msg}[k]);
}

/* images */
const imgCache=new Map();
function getImg(path){
  if(!imgCache.has(path)){
    imgCache.set(path,(async()=>{
      const r=await gh(`contents/${path}${refQ()}`,{headers:{'Accept':'application/vnd.github.raw+json'}});
      if(!r.ok)throw new Error('img');
      return URL.createObjectURL(await r.blob());
    })().catch(e=>{imgCache.delete(path);throw e}));
  }
  return imgCache.get(path);
}
function hydrateImgs(root=document){
  if(!S.cfg)return;
  const go=im=>getImg(im.dataset.path).then(u=>{im.src=u}).catch(()=>im.classList.add('broken'));
  const io=window._io||(window._io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){window._io.unobserve(e.target);go(e.target)}}),{rootMargin:'400px'}):null);
  $$('img[data-path]',root).forEach(im=>{
    if(im.dataset.done)return;im.dataset.done=1;
    io?io.observe(im):go(im);
  });
}
function loadImgEl(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
async function compress(file,max=1280,q=.75){
  const u=URL.createObjectURL(file);
  try{
    const im=await loadImgEl(u);
    const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  }finally{URL.revokeObjectURL(u)}
}
const blobB64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.onerror=rej;f.readAsDataURL(b)});
async function uploadImg(blob,leadId){
  const path=`images/${leadId}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}.jpg`;
  const body={message:'Add photo',content:await blobB64(blob)};if(S.cfg.branch)body.branch=S.cfg.branch;
  const r=await gh('contents/'+path,{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await errMsg(r));
  return path;
}

/* ============ derived ============ */
function urgency(l){
  if(l.stage==='won')return {key:'won',text:'Onboarded',days:0};
  if(l.stage==='lost')return {key:'lost',text:'Closed',days:0};
  if(!l.next)return {key:'nodate',text:'No date set',days:0};
  const d=diffDays(l.next,today());
  if(d<0)return {key:'overdue',text:`Overdue ${-d}d`,days:d};
  if(d===0)return {key:'today',text:'Due today',days:0};
  if(d===1)return {key:'week',text:'Tomorrow',days:1};
  if(d<=7)return {key:'week',text:`In ${d} days`,days:d};
  return {key:'later',text:fmtD(l.next,{day:'numeric',month:'short'}),days:d};
}
const grp=u=>(u.key==='won'||u.key==='lost')?'closed':u.key;
const priRank={high:0,medium:1,low:2};
function sorter(a,b){
  const ua=urgency(a),ub=urgency(b);
  return (priRank[a.priority]??1)-(priRank[b.priority]??1)||(a.next||'9').localeCompare(b.next||'9')||(b.visitDate||'').localeCompare(a.visitDate||'');
}
function filtered(skipUrg){
  const q=S.q.trim().toLowerCase();
  return S.leads.filter(l=>{
    if(S.fType&&l.type!==S.fType)return false;
    if(S.fInterest&&l.interest!==S.fInterest)return false;
    if(S.fPriority&&l.priority!==S.fPriority)return false;
    if(S.fAction&&l.action!==S.fAction)return false;
    if(!skipUrg&&S.urg&&grp(urgency(l))!==S.urg)return false;
    if(q){
      const hay=[l.name,l.place,l.landmark,l.dept,l.type,l.notes,l.nextNote,...(l.contacts||[]).flatMap(c=>[c.name,c.role,...c.phones])].join(' ').toLowerCase();
      if(!hay.includes(q.replace(/\s/g,''))&&!hay.includes(q)&&!hay.replace(/\s/g,'').includes(q.replace(/\s/g,'')))return false;
    }
    return true;
  });
}

  if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html}el.value=val;

  $('#fl').classList.toggle('on',S.showF||nf>0);

function statsHTML(L){
  const n=L.length,C=f=>L.filter(f).length,pct=(a,b)=>b?Math.round(a/b*100):0;
  const closed=l=>l.stage==='won'||l.stage==='lost',hotL=l=>l.interest==='highly'||l.interest==='interested';
  const won=C(l=>l.stage==='won'),open=C(l=>!closed(l)),hot=C(l=>hotL(l)&&!closed(l)),ph=C(l=>firstPhone(l));
  const U={overdue:0,today:0,week:0,later:0,nodate:0};L.forEach(l=>{const k=urgency(l).key;if(k in U)U[k]++});
  const tile=(v,t,c)=>`<div class="stile" style="--c:${c}"><b>${v}</b><span>${t}</span></div>`;
  const bars=r=>{const m=Math.max(1,...r.map(x=>x[1]));return r.map(([t,v,c])=>`<div class="br"><span class="bl" title="${esc(t)}">${esc(t)}</span><span class="bt"><i style="width:${v/m*100}%;background:${c}"></i></span><b>${v}</b></div>`).join('')||'<p class="help">Nothing logged yet</p>'};
  const by=f=>{const m={};L.forEach(l=>{const k=f(l);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const card=(t,b)=>`<section class="st"><h3>${t}</h3>${b}</section>`;
  const days=by(l=>l.visitDate).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14),dm=Math.max(1,...days.map(d=>d[1]));
  const cols=`<div class="cols">${days.map(([d,v])=>`<div><b>${v}</b><i style="height:${v/dm*84}px"></i><span>${fmtD(d,{day:'numeric',month:'short'})}</span></div>`).join('')}</div>`;
  const IC={highly:'var(--green)',interested:'var(--blue)',evaluating:'var(--amber-line)',not:'#98a2b3'};
  const UC={overdue:['Overdue','var(--red)'],today:['Due today','var(--amber-line)'],week:['Next 7 days','var(--blue)'],later:['Later','#98a2b3'],nodate:['No date set','var(--violet)']};
  const AC={call:'var(--blue)',meeting:'var(--violet)',none:'#98a2b3'},PC={high:'var(--red)',medium:'var(--amber-line)',low:'#98a2b3'};
  return `<div class="stiles">${tile(n,'Visits logged','var(--ink)')}${tile(hot,'Hot leads · '+pct(hot,open)+'% of open','var(--green)')}${tile(won,'Onboarded · '+pct(won,n)+'%','var(--brand)')}${tile(U.overdue,'Overdue follow-ups','var(--red)')}${tile(pct(ph,n)+'%','Have a phone number','var(--violet)')}</div><div class="sgrid">`+
  card('Visits per day',cols)+
  card('Follow-up health',bars(Object.entries(U).map(([k,v])=>[UC[k][0],v,UC[k][1]])))+
  card('Interest level',bars(Object.entries(INTEREST).map(([k,v])=>[v.l,C(l=>l.interest===k),IC[k]])))+
  card('Pipeline stage',bars(STAGES.map(([k,t])=>[t,C(l=>l.stage===k),k==='won'?'var(--green)':k==='lost'?'#98a2b3':'var(--brand2)'])))+
  card('By facility type · % hot',bars(by(l=>l.type).map(([t,v])=>[t+' · '+pct(C(l=>l.type===t&&hotL(l)),v)+'%',v,'var(--brand2)'])))+
  card('Priority',bars(Object.entries(PRI).map(([k,t])=>[t,C(l=>l.priority===k),PC[k]])))+
  card('Next action needed',bars(Object.entries(ACT).map(([k,t])=>[t,C(l=>l.action===k),AC[k]])))+
  card('Departments',bars(by(l=>l.dept).slice(0,6).map(([t,v])=>[t,v,'var(--brand2)'])))+
  card('Most requested features',bars(by(l=>(l.feature||'').trim().toLowerCase()).slice(0,6).map(([t,v])=>[t,v,'var(--brand)'])))+
  `</div>`;
}

    <button class="btn small" data-act="edit" data-id="${l.id}">${I.edit}Edit</button><button class="btn small icon" data-act="close-detail" aria-label="Close">${I.x}</button></div>
  <div class="sh-body">
    <div class="tags">${meter(l)}<span class="tag pri-${l.priority}">${l.priority==='high'?'▲ ':''}${PRI[l.priority]||''} priority</span>${l.action!=='none'?`<span class="tag act-${l.action}">${ACT[l.action]}</span>`:''}</div>
    <div class="nextbox u-${u.key}">
      <div class="c-top"><div><h4 style="margin:0 0 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)">Next follow-up</h4><div style="font-weight:650">${l.next?fmtD(l.next,{weekday:'long',day:'numeric',month:'long'}):'Not scheduled'}</div></div><span class="badge" style="background:#fff">${esc(u.text)}</span></div>
      ${l.nextNote?`<p style="margin-top:6px">${esc(l.nextNote)}</p>`:''}
      <div class="row"><button class="chip" data-act="resched" data-d="0">Today</button><button class="chip" data-act="resched" data-d="1">Tomorrow</button><button class="chip" data-act="resched" data-d="3">+3 days</button><button class="chip" data-act="resched" data-d="7">+1 week</button><input type="date" id="dpick" value="${l.next||''}" style="width:auto;min-height:34px;padding:4px 8px"></div>
    </div>
    ${sec('Stage',`<div class="chips">${STAGES.map(([k,t])=>`<button class="chip ${l.stage===k?'on':''}" data-act="stage" data-s="${k}">${t}</button>`).join('')}</div>`)}
    ${sec('Contacts',contacts?`<div style="display:flex;flex-direction:column;gap:8px">${contacts}</div>`:'<span class="nophone">No contact yet — tap Edit to add one</span>')}
    ${sec('Discussion',l.notes?`<p class="t">${esc(l.notes)}</p>`:'')}
    ${sec('Lessons learned',l.lessons?`<p class="t">${esc(l.lessons)}</p>`:'')}
    ${sec('Feature requested',l.feature?`<p class="t">${esc(l.feature)}</p>`:'')}
    ${sec('Photos',`<div class="gal">${(l.images||[]).map(i=>`<img data-path="${esc(i.path)}" data-big="1" alt="">`).join('')}</div><div style="margin-top:8px"><label class="btn small">${I.cam}Add photos<input type="file" id="addPhotos" accept="image/*" multiple hidden></label></div>`)}
    ${sec('Activity',`<div class="row-in"><input type="text" id="logIn" placeholder="Log an update (e.g. called, demo done…)"><button class="btn primary small" data-act="log">Add</button></div>${log?`<div class="log" style="margin-top:10px">${log}</div>`:''}`)}
  </div>`;
  hydrateImgs($('#detail'));
  const dp=$('#dpick');if(dp)dp.onchange=()=>setNext(dp.value);
  const ap=$('#addPhotos');if(ap)ap.onchange=async()=>{await addPhotosToLead(l.id,[...ap.files]);ap.value=''};
}
function mutate(id,fn,logText){
  const l=S.leads.find(x=>x.id===id);if(!l)return;
  const n=clone(l);fn(n);n.updatedAt=new Date().toISOString();
  if(logText)(n.log??=[]).push({ts:n.updatedAt,text:logText});
  commit({type:'upsert',lead:n});
}
function setNext(date){mutate(S.openId,n=>{n.next=date||''},date?'Follow-up set to '+fmtD(date):'Follow-up date cleared')}
async function addPhotosToLead(id,files){
  if(!S.cfg){openSettings('Connect GitHub first.');return}
  toast(`Uploading ${files.length} photo${files.length>1?'s':''}…`,99999);
  try{
    const added=[];
    for(const f of files){const blob=await compress(f);const path=await uploadImg(blob,id);imgCache.set(path,Promise.resolve(URL.createObjectURL(blob)));added.push({path,ts:new Date().toISOString()})}
    mutate(id,n=>{n.images=[...(n.images||[]),...added]},`Added ${added.length} photo${added.length>1?'s':''}`);
    toast('Photos saved');
  }catch(e){toast('Upload failed: '+e.message)}
}

/* ============ form ============ */
const blank=()=>({id:uid(),name:'',type:'Clinic',dept:'',place:'',landmark:'',visitDate:today(),contacts:[{name:'',role:'',phones:['']}],interest:'interested',priority:'medium',stage:'new',action:'call',next:addDays(today(),1),nextNote:'',notes:'',lessons:'',feature:'',images:[],log:[]});
const phoneRow=p=>`<div class="ph-row"><input type="tel" class="ph-in" inputmode="tel" placeholder="Phone number" value="${esc(p)}"><button type="button" class="btn small icon" data-f="rm-ph" aria-label="Remove number">${I.x}</button></div>`;
const contactBlock=c=>`<div class="ct"><div class="f2"><input type="text" class="ct-name" placeholder="Contact name" value="${esc(c.name)}"><input type="text" class="ct-role" list="roles" placeholder="Role (owner, doctor…)" value="${esc(c.role)}"></div>
  <div class="phs">${(c.phones&&c.phones.length?c.phones:['']).map(phoneRow).join('')}</div>
  <div class="ct-actions"><button type="button" class="linkbtn" data-f="add-ph">+ Add another number</button><button type="button" class="linkbtn red" data-f="rm-ct">Remove contact</button></div></div>`;
const seg=(name,opts,val)=>`<div class="seg">${opts.map(([k,t])=>`<label><input type="radio" name="${name}" value="${k}" ${val===k?'checked':''}><span>${t}</span></label>`).join('')}</div>`;
let F=null; // form state: {lead, isNew, imgs:[{path?,url,blob?}]}
function openForm(id){
  const ex=id?S.leads.find(x=>x.id===id):null;
  const lead=ex?clone(ex):blank();
  if(!lead.contacts||!lead.contacts.length)lead.contacts=[{name:'',role:'',phones:['']}];
  F={lead,isNew:!ex,imgs:(lead.images||[]).map(i=>({path:i.path,ts:i.ts}))};
  $('#formSheet').innerHTML=`
  <form id="form" autocomplete="off">
  <div class="sh-head"><h2>${ex?'Edit visit':'New visit'}</h2><button type="button" class="btn small icon" data-f="cancel" aria-label="Close">${I.x}</button></div>
  <div class="sh-body">
    <div class="fld"><label class="l">Facility name *</label><input type="text" id="f_name" required placeholder="e.g. Shamiya Medicare" value="${esc(lead.name)}"></div>
    <div class="f2">
      <div class="fld"><label class="l">Type</label><select id="f_type">${TYPES.map(t=>`<option ${lead.type===t?'selected':''}>${t}</option>`).join('')}${TYPES.includes(lead.type)?'':`<option selected>${esc(lead.type)}</option>`}</select></div>
      <div class="fld"><label class="l">Department</label><input type="text" id="f_dept" list="depts" value="${esc(lead.dept)}" placeholder="Dental, Lab…"></div>
    </div>
    <div class="f2">
      <div class="fld"><label class="l">Place / area</label><input type="text" id="f_place" value="${esc(lead.place)}" placeholder="Kondotty, Areekode…"></div>
      <div class="fld"><label class="l">Landmark / address</label><input type="text" id="f_land" value="${esc(lead.landmark)}" placeholder="Near bus stand, 1st floor"></div>
    </div>
    <div class="f2">
      <div class="fld"><label class="l">Visit date</label><input type="date" id="f_visit" value="${esc(lead.visitDate)}"></div>
    </div>
    <div class="fld"><label class="l">Contacts</label><div id="cts" style="display:flex;flex-direction:column;gap:8px">${lead.contacts.map(contactBlock).join('')}</div><button type="button" class="linkbtn" data-f="add-ct" style="align-self:flex-start">+ Add another contact person</button></div>
    <div class="fld"><label class="l">How interested?</label>${seg('interest',Object.entries(INTEREST).map(([k,v])=>[k,v.l]),lead.interest)}</div>
    <div class="f2">
      <div class="fld"><label class="l">Priority</label>${seg('priority',Object.entries(PRI),lead.priority)}</div>
      <div class="fld"><label class="l">Next action</label>${seg('action',[['call','Call'],['meeting','Meeting / demo'],['none','None']],lead.action)}</div>
    </div>
    <div class="fld"><label class="l">Stage</label><select id="f_stage">${STAGES.map(([k,t])=>`<option value="${k}" ${lead.stage===k?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label class="l">Next follow-up</label>
      <div class="chips" style="margin-bottom:4px"><button type="button" class="chip" data-f="d" data-d="0">Today</button><button type="button" class="chip" data-f="d" data-d="1">Tomorrow</button><button type="button" class="chip" data-f="d" data-d="3">+3 days</button><button type="button" class="chip" data-f="d" data-d="7">+1 week</button><button type="button" class="chip" data-f="d" data-d="">No date</button></div>
      <div class="f2"><input type="date" id="f_next" value="${esc(lead.next)}"><input type="text" id="f_nnote" value="${esc(lead.nextNote)}" placeholder="What to do (e.g. send demo video)"></div></div>
    <div class="fld"><label class="l">Discussion notes</label><textarea id="f_notes" placeholder="What did they say?">${esc(lead.notes)}</textarea></div>
    <div class="f2">
      <div class="fld"><label class="l">Lessons learned</label><textarea id="f_less">${esc(lead.lessons)}</textarea></div>
      <div class="fld"><label class="l">Feature requested</label><textarea id="f_feat">${esc(lead.feature)}</textarea></div>
    </div>
    <div class="fld"><label class="l">Photos (board, card, clinic…)</label><div class="imgs" id="imgs"></div><input type="file" id="f_files" accept="image/*" multiple hidden></div>
  </div>
  <div class="sh-foot">${ex?`<button type="button" class="btn danger" data-f="del">Delete</button>`:'<span></span>'}<div style="display:flex;gap:8px"><button type="button" class="btn" data-f="cancel">Cancel</button><button type="submit" class="btn primary" id="f_save">Save</button></div></div>
  </form>
  <datalist id="depts">${DEPTS.map(d=>`<option value="${d}">`).join('')}</datalist><datalist id="roles">${ROLES.map(d=>`<option value="${d}">`).join('')}</datalist>`;
  drawImgs();openSheet('veilForm');
  setTimeout(()=>{if(!ex)$('#f_name').focus()},50);
}
function drawImgs(){
  const box=$('#imgs');if(!box)return;
  box.innerHTML=F.imgs.map((im,i)=>`<div class="im"><img ${im.url?`src="${im.url}"`:`data-path="${esc(im.path)}"`} alt=""><button type="button" data-f="rm-img" data-i="${i}" aria-label="Remove photo">×</button></div>`).join('')+`<button type="button" class="addimg" data-f="pick-img">${I.cam}<span>Add photo</span></button>`;
  hydrateImgs(box);
}
function closeForm(){closeSheet('veilForm');F=null}
function collect(){
  const v=id=>$('#'+id).value.trim();
  const rad=n=>($(`input[name=${n}]:checked`)||{}).value;
  const contacts=$$('#cts .ct').map(ct=>({name:$('.ct-name',ct).value.trim(),role:$('.ct-role',ct).value.trim(),phones:$$('.ph-in',ct).map(i=>i.value.replace(/[^\d+]/g,'')).filter(Boolean)})).filter(c=>c.name||c.role||c.phones.length);
  return {name:v('f_name'),type:v('f_type'),dept:v('f_dept'),place:v('f_place'),landmark:v('f_land'),visitDate:v('f_visit'),contacts,interest:rad('interest'),priority:rad('priority'),action:rad('action'),stage:v('f_stage'),next:v('f_next'),nextNote:v('f_nnote'),notes:$('#f_notes').value.trim(),lessons:$('#f_less').value.trim(),feature:$('#f_feat').value.trim()};
}
async function submitForm(e){
  e.preventDefault();
  if(!S.cfg){openSettings('Connect GitHub first so this can be saved.');return}
  const btn=$('#f_save');btn.disabled=true;
  const data=collect();
  if(!data.name){btn.disabled=false;$('#f_name').focus();return}
  try{
    const imgs=[];let n=0;const need=F.imgs.filter(i=>i.blob).length;
    for(const im of F.imgs){
      if(im.blob){btn.textContent=`Uploading ${++n}/${need}…`;const path=await uploadImg(im.blob,F.lead.id);imgCache.set(path,Promise.resolve(im.url));imgs.push({path,ts:new Date().toISOString()})}
      else imgs.push({path:im.path,ts:im.ts});
    }
    const now=new Date().toISOString();
    const lead={...F.lead,...data,images:imgs,updatedAt:now,createdAt:F.lead.createdAt||now};
    if(F.isNew)lead.log=[{ts:now,text:'Visit logged'}];
    else if(F.lead.stage!==data.stage)(lead.log??=[]).push({ts:now,text:'Stage → '+STAGE[data.stage]});
    const ok=commit({type:'upsert',lead});
    if(ok){closeForm();toast('Saved')}
  }catch(err){toast('Could not save: '+err.message,4000)}
  finally{const b=$('#f_save');if(b){b.disabled=false;b.textContent='Save'}}
}

/* ============ settings ============ */
function openSettings(msg){
  const c=S.cfg||{owner:'',repo:'',branch:'',token:''};
  $('#setSheet').innerHTML=`<form id="setForm" autocomplete="off">
  <div class="sh-head"><h2>Connect GitHub</h2><button type="button" class="btn small icon" data-s="close" aria-label="Close">${I.x}</button></div>
  <div class="sh-body">
    ${msg?`<div class="banner" style="margin:0">${esc(msg)}</div>`:''}
    <p class="help">Your visits live in a <b>private</b> GitHub repo. This page reads and writes them with a token. Enter once per device — it stays on this device only.</p>
    <div class="f2"><div class="fld"><label class="l">GitHub username / org</label><input type="text" id="s_owner" value="${esc(c.owner)}" placeholder="kiran…" autocapitalize="off"></div>
    <div class="fld"><label class="l">Data repo name</label><input type="text" id="s_repo" value="${esc(c.repo)}" placeholder="aarohcare-data" autocapitalize="off"></div></div>
    <div class="f2"><div class="fld"><label class="l">Branch (optional)</label><input type="text" id="s_branch" value="${esc(c.branch)}" placeholder="main" autocapitalize="off"></div>
    <div class="fld"><label class="l">Access token</label><input type="password" id="s_token" value="${esc(c.token)}" placeholder="github_pat_…" autocapitalize="off"></div></div>
    <div class="help"><b>Make a token:</b><ol><li>GitHub → Settings → Developer settings → Fine-grained tokens → Generate</li><li>Repository access: <i>Only select repositories</i> → pick the data repo</li><li>Permissions → Repository → <i>Contents: Read and write</i></li></ol></div>
    <div id="s_msg" class="help"></div>
    <div class="row-in" style="flex-wrap:wrap"><button type="button" class="btn small" data-s="export">Download backup (CSV)</button>${S.cfg?'<button type="button" class="btn small danger" data-s="disc">Disconnect this device</button>':''}</div>
  </div>
  <div class="sh-foot"><span></span><div style="display:flex;gap:8px"><button type="button" class="btn" data-s="close">Cancel</button><button type="submit" class="btn primary" id="s_save">Save &amp; connect</button></div></div></form>`;
  openSheet('veilSet');
}
async function saveSettings(e){
  e.preventDefault();
  const cfg={owner:$('#s_owner').value.trim(),repo:$('#s_repo').value.trim(),branch:$('#s_branch').value.trim(),token:$('#s_token').value.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token){$('#s_msg').textContent='Fill username, repo and token.';return}
  const btn=$('#s_save');btn.disabled=true;btn.textContent='Checking…';
  const old=S.cfg;S.cfg=cfg;
  try{
    const r=await gh('');if(!r.ok)throw new Error(await errMsg(r));
    const j=await r.json();
    if(j.permissions&&!j.permissions.push)throw new Error('Token can read but not write. Give it Contents: Read and write.');
    store.set('ac_cfg',cfg);S.readonly=false;closeSheet('veilSet');toast('Connected');await load();
  }catch(err){S.cfg=old;$('#s_msg').innerHTML=`<span style="color:var(--red)">${esc(err.message)}</span>`}
  finally{btn.disabled=false;btn.textContent='Save & connect'}
}
function exportCSV(){
  const cols=['Visit Date','Facility Name','Type','Department','Place','Landmark','Contacts','Interest','Priority','Stage','Action','Next Follow-Up','Next Note','Notes','Lessons','Feature'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=S.leads.map(l=>[l.visitDate,l.name,l.type,l.dept,l.place,l.landmark,(l.contacts||[]).map(c=>[c.name,c.role,(c.phones||[]).join(' / ')].filter(Boolean).join(' - ')).join(' ; '),INTEREST[l.interest]?.l,PRI[l.priority],STAGE[l.stage],ACT[l.action],l.next,l.nextNote,l.notes,l.lessons,l.feature].map(q).join(','));
  const blob=new Blob(['﻿'+cols.map(q).join(',')+'\n'+rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`aarohcare-visits-${today()}.csv`;a.click();
}

/* ============ toast ============ */
let toastT;
function toast(t,ms=2200){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none'},ms)}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('a'))return;
  // form-level actions
  const f=t.closest('[data-f]');
  if(f&&F){
    const a=f.dataset.f;
    if(a==='cancel'){closeForm();return}
    if(a==='add-ct'){$('#cts').insertAdjacentHTML('beforeend',contactBlock({name:'',role:'',phones:['']}));return}
    if(a==='rm-ct'){const cts=$$('#cts .ct');if(cts.length>1)f.closest('.ct').remove();else $$('input',f.closest('.ct')).forEach(i=>i.value='');return}
    if(a==='add-ph'){f.closest('.ct').querySelector('.phs').insertAdjacentHTML('beforeend',phoneRow(''));return}
    if(a==='rm-ph'){const p=f.closest('.phs');if(p.children.length>1)f.closest('.ph-row').remove();else $('input',f.closest('.ph-row')).value='';return}
    if(a==='d'){$('#f_next').value=f.dataset.d===''?'':addDays(today(),+f.dataset.d);return}
    if(a==='pick-img'){$('#f_files').click();return}
    if(a==='rm-img'){F.imgs.splice(+f.dataset.i,1);drawImgs();return}
    if(a==='del'){if(confirm('Delete this visit permanently?')){const id=F.lead.id;if(commit({type:'delete',id})){closeForm();closeDetail();toast('Deleted')}}return}
  }
  const s=t.closest('[data-s]');
  if(s&&s.closest('#setSheet')){
    if(s.dataset.s==='close')closeSheet('veilSet');
    if(s.dataset.s==='export')exportCSV();
    if(s.dataset.s==='disc'&&confirm('Remove the token from this device?')){localStorage.removeItem('ac_cfg');localStorage.removeItem('ac_cache');localStorage.removeItem('ac_pending');S.cfg=null;S.remote=[];S.pending=[];recompute();closeSheet('veilSet');load();}
    return;
  }
  const el=t.closest('[data-act]');
  if(!el){ // click on veil background
    if(t.id==='veilDetail')closeDetail();
    if(t.id==='veilSet')closeSheet('veilSet');
    if(t.closest('.lightbox')&&!t.closest('img'))$('#lb').classList.remove('on');
    const big=t.closest('img[data-big]');
    return;
  }
  const act=el.dataset.act;
  if(act==='open')openDetail(el.dataset.id);
  else if(act==='new'){if(!S.cfg){openSettings('Connect GitHub first so visits can be saved.');return}openForm()}
  else if(act==='edit'){openForm(el.dataset.id)}
  else if(act==='close-detail')closeDetail();
  else if(act==='settings')openSettings();
  else if(act==='menu'){const m=$('#menu');m.hidden=!m.hidden}
  else if(act==='theme')setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  else if(act==='stats'){S.view='stats';render();scrollTo(0,0)}
  else if(act==='csv')exportCSV();
  else if(act==='json')exportJSON();
  else if(act==='sync'){if(!S.cfg)openSettings();else if(S.pending.length)pushAll();else load()}
  else if(act==='filters'){S.showF=!S.showF;render()}
  else if(act==='kpi'){S.urg=(S.urg===el.dataset.k?'':el.dataset.k);render()}
  else if(act==='resched'){const d=+el.dataset.d;setNext(addDays(today(),d))}
  else if(act==='stage'){const st=el.dataset.s;mutate(S.openId,n=>{n.stage=st},'Stage → '+STAGE[st])}
  else if(act==='log'){const i=$('#logIn');const tx=i.value.trim();if(tx)mutate(S.openId,n=>{},tx)}
});
document.addEventListener('click',e=>{
  const im=e.target.closest('img[data-big]');
  if(im&&im.src){$('#lb img').src=im.src;$('#lb').classList.add('on')}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='form')submitForm(e);
  if(e.target.id==='setForm')saveSettings(e);
});
document.addEventListener('change',async e=>{
  if(e.target.id==='f_files'&&F){
    for(const f of [...e.target.files]){try{const blob=await compress(f);F.imgs.push({blob,url:URL.createObjectURL(blob)})}catch{toast('Could not read that photo')}}
    e.target.value='';drawImgs();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#lb').classList.contains('on'))$('#lb').classList.remove('on');
    else if($('#veilForm').classList.contains('on'))closeForm();
    else if($('#veilSet').classList.contains('on'))closeSheet('veilSet');
    else if($('#veilDetail').classList.contains('on'))closeDetail();
  }
  if(e.key==='Enter'&&e.target.id==='logIn'){e.preventDefault();const tx=e.target.value.trim();if(tx)mutate(S.openId,n=>{},tx)}
});
let qT;$('#q').addEventListener('input',e=>{S.q=e.target.value;clearTimeout(qT);qT=setTimeout(render,140)});
for(const [id,k] of [['fType','fType'],['fInterest','fInterest'],['fPriority','fPriority'],['fAction','fAction']])$('#'+id).addEventListener('change',e=>{S[k]=e.target.value;render()});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.view=b.dataset.view;render()}});

document.addEventListener('click',e=>{if(!e.target.closest('[data-act=menu]'))$('#menu').hidden=true});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* auto-refresh */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.cfg&&!pushing)load(true)});
setInterval(()=>{if(S.cfg&&!document.hidden&&!pushing&&!S.pending.length&&!$$('.veil.on').length)load(true)},90000);

/* ============ go ============ */
recompute();render();
if(S.pending.length&&S.cfg)setStatus('err','Unsynced changes');else setStatus(S.cfg?'busy':'none','Syncing…');
load();
</script>
</body>
</html>
